<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1 class="teste">Eventos Acadêmicos</h1>
    <form method="post">
        <input name="nome" placeholder="Nome do Evento" required>
        <input name="data" placeholder="Data (ex: 2026-10-15)" required>
        <input name="local" placeholder="Local" required>
        <input name="vagas" type="number" placeholder="Vagas" min="1" required>
        <button type="submit">Cadastrar Evento</button>
    </form>
    <ul>
        {% for e in eventos %}
            <li><strong>{{ e.nome }}</strong> - {{ e.data }} - {{ e.local }} ({{ e.vagas }} vagas)</li>
        {% else %}
            <li>Nenhum evento cadastrado ainda.</li>
        {% endfor %}
    </ul>
</body>
</html>
